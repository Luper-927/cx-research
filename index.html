<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>CX Web v0.8</title>

<style>
:root{
  --bg:#111318;--panel:#191d25;--panel2:#222936;
  --text:#f1f3f8;--muted:#929baa;--line:#303744;
  --accent:#6d8cff;--green:#45d49a;--red:#ff6868;
  --yellow:#e8bd58;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{
  background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:8px;padding:10px 13px;cursor:pointer
}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
button.danger{color:var(--red)}
input,textarea,select{
  width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);outline:none
}
textarea{min-height:260px;resize:vertical;font-family:monospace;line-height:1.6}
#topbar{
  height:58px;position:sticky;top:0;z-index:10;background:var(--panel);
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;padding:0 16px
}
.logo{font-size:20px;font-weight:bold;letter-spacing:1px}
.logo span{color:var(--accent)}
#status{font-size:12px;color:var(--green)}
#app{display:flex;min-height:calc(100vh - 58px)}
#sidebar{width:190px;flex-shrink:0;padding:14px 9px;background:var(--panel);border-right:1px solid var(--line)}
.nav{display:block;width:100%;text-align:left;margin-bottom:5px;color:var(--muted);background:transparent;border-color:transparent}
.nav.active{color:white;background:var(--panel2);border-color:var(--line)}
#main{flex:1;min-width:0;max-width:1100px;padding:22px}
h1{font-size:25px;margin:0 0 8px}
h2{font-size:17px;margin:0 0 12px}
p{color:var(--muted);line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.muted{font-size:12px;color:var(--muted)}
.file-row{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid var(--line);cursor:pointer;overflow-wrap:anywhere}
.file-row:hover{background:var(--panel2)}
.file-name{flex:1;min-width:0;overflow-wrap:anywhere}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:15px}
.stat strong{display:block;font-size:24px;margin-top:8px}
.good{color:var(--green)}
.bad{color:var(--red)}
.warning{color:var(--yellow)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);line-height:1.5}
#errors{display:none;background:#421e25;color:#ffc2c2;padding:12px;margin:12px;border-radius:8px;white-space:pre-wrap}
#terminalOutput{min-height:160px;white-space:pre-wrap;font-family:monospace;color:var(--green);line-height:1.6}
.hidden{display:none!important}
.hash{font-family:monospace;font-size:11px;overflow-wrap:anywhere;color:var(--muted)}
@media(max-width:650px){
  #app{display:block}
  #sidebar{width:100%;display:flex;overflow-x:auto;position:sticky;top:58px;z-index:5;padding:7px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{width:auto;flex-shrink:0;margin:0 4px 0 0;text-align:center;padding:10px}
  #main{padding:17px 12px}
}
</style>
</head>

<body>

<header id="topbar">
  <div class="logo">CX<span>.</span> WEB</div>
  <div id="status">Starting...</div>
</header>

<div id="errors"></div>

<div id="app">
<aside id="sidebar">
  <button class="nav active" data-page="home">⌂ Home</button>
  <button class="nav" data-page="files">▤ Files</button>
  <button class="nav" data-page="notes">▧ Notes</button>
  <button class="nav" data-page="terminal">⌘ Terminal</button>
  <button class="nav" data-page="monitor">◉ Monitor</button>
  <button class="nav" data-page="integrity">◆ Integrity</button>
  <button class="nav" data-page="journal">▤ Journal</button>
  <button class="nav" data-page="settings">☷ Settings</button>
</aside>
<main id="main"></main>
</div>

<script>
"use strict";

/* ==========================================
   CX WEB v0.8
   SHA-256 APPEND-ONLY JOURNAL
========================================== */

const STORAGE_KEY = "cx";
const JOURNAL_KEY = "cx_journal_v1";
const GENESIS_HASH = "0".repeat(64);

let data = {};
let page = "home";
let selectedFile = null;
let currentFolder = "/";
let transactionRunning = false;

const main = document.getElementById("main");
const statusBox = document.getElementById("status");
const errorsBox = document.getElementById("errors");

function reportError(error){
  errorsBox.style.display = "block";
  errorsBox.textContent = "CX ERROR: " +
    (error && error.message ? error.message : String(error));
}

window.addEventListener("error",e=>reportError(e.error||e.message));
window.addEventListener("unhandledrejection",e=>reportError(e.reason));

/* ==========================================
   STORAGE
========================================== */

function loadWorkspace(){
  const raw=localStorage.getItem(STORAGE_KEY);

  if(!raw)throw new Error("No existing CX workspace found.");

  const parsed=JSON.parse(raw);

  if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))
    throw new Error("Invalid workspace structure.");

  if(!parsed.fs||typeof parsed.fs!=="object")
    throw new Error("Filesystem object is missing.");

  data=parsed;
}

function saveWorkspace(){
  const raw=JSON.stringify(data);
  localStorage.setItem(STORAGE_KEY,raw);

  if(localStorage.getItem(STORAGE_KEY)!==raw)
    throw new Error("Storage read-back verification failed.");

  statusBox.textContent="Saved and verified";
}

function getFS(){
  return data.fs;
}

/* ==========================================
   SHA-256
========================================== */

function requireCrypto(){
  if(!window.crypto||!crypto.subtle)
    throw new Error(
      "Secure SHA-256 is unavailable. Open CX through HTTPS."
    );
}

async function sha256(text){
  requireCrypto();

  const bytes=new TextEncoder().encode(text);
  const digest=await crypto.subtle.digest("SHA-256",bytes);

  return Array.from(new Uint8Array(digest))
    .map(byte=>byte.toString(16).padStart(2,"0"))
    .join("");
}

/* The hash is calculated from these exact fields.
   The hash field itself is excluded. */

function canonicalRecord(record){
  return JSON.stringify({
    n:record.n,
    timestamp:record.timestamp,
    action:record.action,
    details:record.details,
    previousHash:record.previousHash
  });
}

function getNewJournal(){
  if(!Array.isArray(data[JOURNAL_KEY]))
    data[JOURNAL_KEY]=[];

  return data[JOURNAL_KEY];
}

/* ==========================================
   JOURNAL INITIALIZATION
========================================== */

async function initializeJournal(){
  if(!Array.isArray(data[JOURNAL_KEY])){
    data[JOURNAL_KEY]=[];

    await appendJournalRecord(
      "journal.initialized",
      {
        legacyRecords:Array.isArray(data.j)?data.j.length:0,
        filesystemEntries:Object.keys(data.fs).length,
        version:"0.8"
      }
    );
  }
}

/* ==========================================
   APPEND-ONLY JOURNAL
========================================== */

async function appendJournalRecord(action,details){
  const journal=getNewJournal();

  const previousHash=journal.length
    ?journal[journal.length-1].hash
    :GENESIS_HASH;

  const record={
    n:journal.length,
    timestamp:new Date().toISOString(),
    action:String(action),
    details:details||{},
    previousHash,
    hash:""
  };

  record.hash=await sha256(canonicalRecord(record));

  journal.push(record);
}

/* ==========================================
   TRANSACTION ENGINE
========================================== */

/*
  Every supported workspace operation:
  1. Takes a snapshot.
  2. Applies the operation.
  3. Creates a hash-chained journal record.
  4. Saves the workspace.
  5. Rolls back in-memory data if anything fails.
*/

async function transact(action,details,operation){
  if(transactionRunning)
    throw new Error("Another workspace operation is running.");

  transactionRunning=true;

  const snapshot=JSON.stringify(data);

  try{
    const result=operation();

    await appendJournalRecord(action,details);

    saveWorkspace();

    return result;

  }catch(error){
    data=JSON.parse(snapshot);
    throw error;

  }finally{
    transactionRunning=false;
  }
}

/* ==========================================
   JOURNAL VERIFICATION
========================================== */

async function verifyJournal(){
  const journal=data[JOURNAL_KEY];

  if(!Array.isArray(journal)){
    return{
      initialized:false,
      valid:false,
      count:0,
      issues:["New cryptographic journal is missing."]
    };
  }

  const issues=[];
  let expectedPrevious=GENESIS_HASH;

  for(let i=0;i<journal.length;i++){
    const record=journal[i];

    if(!record||typeof record!=="object"){
      issues.push("Invalid record at position "+i);
      continue;
    }

    if(record.n!==i){
      issues.push("Sequence mismatch at position "+i);
    }

    if(record.previousHash!==expectedPrevious){
      issues.push("Previous-hash mismatch at position "+i);
    }

    if(typeof record.hash!=="string"||
       !/^[a-f0-9]{64}$/.test(record.hash)){
      issues.push("Invalid SHA-256 hash at position "+i);
      expectedPrevious=record.hash||"";
      continue;
    }

    try{
      const calculated=await sha256(canonicalRecord(record));

      if(calculated!==record.hash){
        issues.push("Hash mismatch at position "+i);
      }
    }catch(error){
      issues.push("Verification error at position "+i+": "+error.message);
    }

    expectedPrevious=record.hash;
  }

  return{
    initialized:true,
    valid:issues.length===0,
    count:journal.length,
    issues
  };
}

/* ==========================================
   FILESYSTEM
========================================== */

function parentOf(path){
  if(path==="/")return null;

  const parts=path.split("/");
  parts.pop();

  return parts.join("/")||"/";
}

function nameOf(path){
  return path.split("/").filter(Boolean).pop()||"/";
}

function childrenOf(folder){
  return Object.keys(getFS()).filter(path=>
    path!=="/"&&parentOf(path)===folder
  );
}

function readFile(entry){
  if(!entry||typeof entry!=="object")return "";

  if(typeof entry.c==="string")return entry.c;
  if(typeof entry.content==="string")return entry.content;

  return "";
}

function writeFile(entry,value){
  if(Object.prototype.hasOwnProperty.call(entry,"c")){
    entry.c=value;
  }else if(Object.prototype.hasOwnProperty.call(entry,"content")){
    entry.content=value;
  }else{
    entry.c=value;
  }
}

function validPath(path){
  if(typeof path!=="string")return false;
  if(!path.startsWith("/"))return false;
  if(path==="/")return true;
  if(path.includes("//")||path.endsWith("/"))return false;

  const parts=path.split("/");

  return !parts.includes(".")&&!parts.includes("..");
}

function filesystemAudit(){
  const fs=getFS();
  const issues=[];
  const paths=Object.keys(fs);

  if(!fs["/"]){
    issues.push("Root directory is missing.");
  }else if(fs["/"].t!=="d"){
    issues.push("Root entry is not a directory.");
  }

  for(const path of paths){
    const entry=fs[path];

    if(!validPath(path)){
      issues.push("Invalid path: "+path);
      continue;
    }

    if(!entry||typeof entry!=="object"){
      issues.push("Invalid entry: "+path);
      continue;
    }

    if(path==="/")continue;

    const parent=parentOf(path);

    if(!fs[parent]){
      issues.push("Missing parent: "+parent);
    }else if(fs[parent].t!=="d"){
      issues.push("Parent is not a directory: "+parent);
    }

    if(entry.t!=="d"&&entry.t!=="f"){
      issues.push("Unknown entry type: "+path);
    }

    if(entry.t==="f"&&
       typeof entry.c!=="string"&&
       typeof entry.content!=="string"){
      issues.push("File has no recognized content: "+path);
    }
  }

  return{total:paths.length,issues};
}

/* ==========================================
   PERSISTENCE TEST
========================================== */

function testPersistence(){
  const key="cx_v08_integrity_probe";
  const value="CX-PERSISTENCE-"+Date.now();

  try{
    localStorage.setItem(key,value);
    const result=localStorage.getItem(key);
    localStorage.removeItem(key);

    return{
      passed:result===value,
      message:result===value
        ?"Browser storage write/read test passed."
        :"Browser storage read-back failed."
    };

  }catch(error){
    try{localStorage.removeItem(key)}catch(e){}

    return{passed:false,message:error.message};
  }
}

/* ==========================================
   LEGACY JOURNAL INSPECTION
========================================== */

function inspectLegacyJournal(){
  const journal=data.j;

  if(!Array.isArray(journal)){
    return{
      count:0,
      valid:false,
      issues:["Legacy journal is missing or invalid."]
    };
  }

  const issues=[];

  journal.forEach((record,index)=>{
    if(!record||typeof record!=="object"){
      issues.push("Invalid legacy record at "+index);
      return;
    }

    if(!Object.prototype.hasOwnProperty.call(record,"n"))
      issues.push("Legacy record "+index+" has no sequence number.");

    if(!Object.prototype.hasOwnProperty.call(record,"op"))
      issues.push("Legacy record "+index+" has no operation.");

    if(!Object.prototype.hasOwnProperty.call(record,"h"))
      issues.push("Legacy record "+index+" has no hash.");
  });

  return{
    count:journal.length,
    valid:issues.length===0,
    issues
  };
}

/* ==========================================
   NAVIGATION
========================================== */

document.querySelectorAll(".nav").forEach(button=>{
  button.addEventListener("click",()=>{
    page=button.dataset.page;

    document.querySelectorAll(".nav").forEach(item=>{
      item.classList.toggle("active",item.dataset.page===page);
    });

    render();
  });
});

function navigate(destination){
  page=destination;

  document.querySelectorAll(".nav").forEach(item=>{
    item.classList.toggle("active",item.dataset.page===destination);
  });

  render();
}

/* ==========================================
   HOME
========================================== */

function renderHome(){
  const fs=getFS();

  const files=Object.keys(fs).filter(path=>
    path!=="/"&&fs[path].t==="f"
  );

  const folders=Object.keys(fs).filter(path=>
    path!=="/"&&fs[path].t==="d"
  );

  main.innerHTML=`
    <h1>CX Workspace</h1>
    <p>Persistent computing environment.</p>

    <div class="stat-grid">
      <div class="stat">
        <span class="muted">Files</span>
        <strong>${files.length}</strong>
      </div>
      <div class="stat">
        <span class="muted">Folders</span>
        <strong>${folders.length}</strong>
      </div>
      <div class="stat">
        <span class="muted">Legacy records</span>
        <strong>${Array.isArray(data.j)?data.j.length:0}</strong>
      </div>
      <div class="stat">
        <span class="muted">New records</span>
        <strong>${getNewJournal().length}</strong>
      </div>
    </div>

    <div class="card">
      <h2>Workspace controls</h2>
      <div class="actions">
        <button class="primary" onclick="navigate('files')">Open Files</button>
        <button onclick="navigate('integrity')">Check Integrity</button>
        <button onclick="exportWorkspace()">Backup Workspace</button>
      </div>
    </div>

    <div class="card">
      <h2>Version</h2>
      <p>CX Web v0.8</p>
      <p class="muted">
        Local browser execution. Remote compute and cross-device
        synchronization are not implemented.
      </p>
    </div>
  `;
}

/* ==========================================
   FILE MANAGER
========================================== */

function renderFiles(){
  const children=childrenOf(currentFolder);

  let html=`
    <div class="row">
      <div>
        <h1>Files</h1>
        <p>Location: ${esc(currentFolder)}</p>
      </div>
      <div class="actions">
        <button onclick="createFile()">+ File</button>
        <button onclick="createFolder()">+ Folder</button>
      </div>
    </div>
    <div class="card">
  `;

  if(currentFolder!=="/"){
    html+=`<div class="file-row" onclick="goParent()">↩ Back</div>`;
  }

  if(children.length===0)html+="<p>This folder is empty.</p>";

  children.forEach(path=>{
    const entry=getFS()[path];
    const folder=entry.t==="d";

    html+=`
      <div class="file-row" data-path="${esc(path)}">
        <span>${folder?"📁":"📄"}</span>
        <span class="file-name">${esc(nameOf(path))}</span>
        <span class="muted">${folder?"Folder":"File"}</span>
      </div>
    `;
  });

  html+="</div>";

  if(selectedFile&&getFS()[selectedFile]){
    const content=readFile(getFS()[selectedFile]);

    html+=`
      <div class="card">
        <div class="row">
          <div>
            <h2>${esc(nameOf(selectedFile))}</h2>
            <div class="muted">${esc(selectedFile)}</div>
          </div>
          <div class="actions">
            <button class="primary" onclick="saveCurrentFile()">Save</button>
            <button onclick="renameCurrent()">Rename</button>
            <button class="danger" onclick="deleteCurrent()">Delete</button>
          </div>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>
        <div id="editorStatus" class="muted">${content.length} characters loaded</div>
      </div>
    `;
  }

  main.innerHTML=html;

  main.querySelectorAll("[data-path]").forEach(row=>{
    row.addEventListener("click",()=>openPath(row.dataset.path));
  });

  if(selectedFile&&getFS()[selectedFile]){
    document.getElementById("editor").value=readFile(getFS()[selectedFile]);
  }
}

function openPath(path){
  const entry=getFS()[path];

  if(!entry)return alert("Entry not found.");

  if(entry.t==="d"){
    currentFolder=path;
    selectedFile=null;
  }else{
    selectedFile=path;
  }

  renderFiles();
}

function goParent(){
  currentFolder=parentOf(currentFolder)||"/";
  selectedFile=null;
  renderFiles();
}

async function saveCurrentFile(){
  if(!selectedFile)return;

  const path=selectedFile;
  const editor=document.getElementById("editor");

  if(!editor||!getFS()[path])return;

  const value=editor.value;

  try{
    await transact("file.updated",{path,characters:value.length},()=>{
      writeFile(getFS()[path],value);
    });

    document.getElementById("editorStatus").textContent=
      "Saved and journaled: "+value.length+" characters.";

  }catch(error){reportError(error)}
}

async function createFile(){
  const name=prompt("File name:");
  if(!name||!name.trim())return;

  const path=joinPath(currentFolder,name.trim());

  if(!validPath(path)||getFS()[path])
    return alert("Invalid path or name already exists.");

  try{
    await transact("file.created",{path},()=>{
      getFS()[path]={t:"f",c:""};
    });

    selectedFile=path;
    renderFiles();

  }catch(error){reportError(error)}
}

async function createFolder(){
  const name=prompt("Folder name:");
  if(!name||!name.trim())return;

  const path=joinPath(currentFolder,name.trim());

  if(!validPath(path)||getFS()[path])
    return alert("Invalid path or name already exists.");

  try{
    await transact("folder.created",{path},()=>{
      getFS()[path]={t:"d"};
    });

    renderFiles();

  }catch(error){reportError(error)}
}

function joinPath(folder,name){
  return folder==="/"?"/"+name:folder+"/"+name;
}

async function renameCurrent(){
  if(!selectedFile)return;

  const oldPath=selectedFile;
  const newName=prompt("New name:",nameOf(oldPath));

  if(!newName||!newName.trim())return;

  const newPath=joinPath(parentOf(oldPath),newName.trim());

  if(!validPath(newPath)||getFS()[newPath])
    return alert("Invalid path or destination already exists.");

  try{
    await transact("file.renamed",{from:oldPath,to:newPath},()=>{
      getFS()[newPath]=getFS()[oldPath];
      delete getFS()[oldPath];
    });

    selectedFile=newPath;
    renderFiles();

  }catch(error){reportError(error)}
}

async function deleteCurrent(){
  if(!selectedFile)return;

  const path=selectedFile;
  if(!getFS()[path])return;

  const descendants=Object.keys(getFS()).filter(candidate=>
    candidate.startsWith(path+"/")
  );

  if(descendants.length)
    return alert("This folder contains entries. Delete or move them first.");

  if(!confirm("Delete "+path+"?"))return;

  try{
    await transact("file.deleted",{path},()=>{
      delete getFS()[path];
    });

    selectedFile=null;
    renderFiles();

  }catch(error){reportError(error)}
}

/* ==========================================
   NOTES
========================================== */

function renderNotes(){
  if(!Array.isArray(data.notes)){
    main.innerHTML=`
      <h1>Notes</h1>
      <p class="warning">Notes data is not an array. It has not been modified.</p>
    `;
    return;
  }

  let html=`
    <h1>Notes</h1>
    <div class="card">
      <textarea id="newNote" placeholder="Write a note..." style="min-height:110px"></textarea>
      <br><br>
      <button class="primary" onclick="addNote()">Save Note</button>
    </div>
  `;

  data.notes.forEach((note,index)=>{
    const text=typeof note==="string"?note:(note.text||"");

    html+=`
      <div class="card">
        <pre>${esc(text)}</pre>
        <button onclick="deleteNote(${index})">Delete</button>
      </div>
    `;
  });

  main.innerHTML=html;
}

async function addNote(){
  const input=document.getElementById("newNote");
  if(!input||!input.value.trim())return;

  const value=input.value;

  try{
    await transact("note.created",{characters:value.length},()=>{
      data.notes.push({
        text:value,
        createdAt:new Date().toISOString()
      });
    });
