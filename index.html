<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>CX Web v0.6</title>

<style>
:root {
  --bg:#111318;
  --panel:#191d25;
  --panel2:#202530;
  --text:#f1f3f8;
  --muted:#929baa;
  --line:#303744;
  --accent:#6d8cff;
  --danger:#ff6565;
  --success:#45d49a;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
  min-height:100vh;
}

button,input,textarea {
  font:inherit;
}

button {
  cursor:pointer;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:10px 13px;
}

button:hover {border-color:var(--accent)}

button.primary {
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

input,textarea {
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px;
  width:100%;
  outline:none;
}

input:focus,textarea:focus {
  border-color:var(--accent);
}

#topbar {
  height:58px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:var(--panel);
  position:sticky;
  top:0;
  z-index:5;
}

.logo {
  font-size:19px;
  font-weight:bold;
  letter-spacing:1px;
}

.logo span {color:var(--accent)}

#status {
  font-size:11px;
  color:var(--success);
}

#app {
  display:flex;
  min-height:calc(100vh - 58px);
}

#sidebar {
  width:190px;
  flex-shrink:0;
  padding:15px 10px;
  border-right:1px solid var(--line);
  background:var(--panel);
}

.nav {
  display:block;
  width:100%;
  text-align:left;
  margin-bottom:6px;
  background:transparent;
  border-color:transparent;
  color:var(--muted);
}

.nav.active {
  color:white;
  background:var(--panel2);
  border-color:var(--line);
}

#main {
  flex:1;
  min-width:0;
  padding:22px;
  max-width:1100px;
}

h1 {
  font-size:25px;
  margin:0 0 7px;
}

h2 {
  font-size:17px;
  margin:0 0 14px;
}

p {
  color:var(--muted);
  line-height:1.5;
}

.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin:14px 0;
}

.row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.file-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  border-radius:7px;
}

.file-row:hover {
  background:var(--panel2);
}

.file-name {
  flex:1;
  overflow-wrap:anywhere;
}

.file-icon {font-size:19px}

.muted {
  color:var(--muted);
  font-size:12px;
}

#editor {
  min-height:260px;
  resize:vertical;
  font-family:monospace;
  line-height:1.6;
  font-size:14px;
  margin-top:12px;
}

#editorStatus {
  font-size:12px;
  color:var(--success);
  margin-top:9px;
}

.hidden {display:none!important}

.stat-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}

.stat {
  background:var(--panel2);
  border:1px solid var(--line);
  padding:15px;
  border-radius:10px;
}

.stat strong {
  display:block;
  font-size:24px;
  margin-top:7px;
}

#terminalOutput {
  min-height:150px;
  white-space:pre-wrap;
  font-family:monospace;
  color:var(--success);
  line-height:1.6;
}

#terminalInput {
  font-family:monospace;
}

#errors {
  background:#411e25;
  color:#ffb4b4;
  padding:12px;
  margin:12px;
  border-radius:8px;
  display:none;
  white-space:pre-wrap;
}

#mobileNav {
  display:none;
}

@media(max-width:650px) {
  #app {display:block}

  #sidebar {
    display:flex;
    width:100%;
    overflow-x:auto;
    padding:8px;
    border-right:0;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:58px;
    z-index:4;
  }

  .nav {
    width:auto;
    flex-shrink:0;
    margin:0 4px 0 0;
    padding:10px;
    text-align:center;
  }

  #main {padding:17px 13px}
}
</style>
</head>

<body>

<div id="topbar">
  <div class="logo">CX<span>.</span> WEB</div>
  <div id="status">Workspace ready</div>
</div>

<div id="errors"></div>

<div id="app">

  <aside id="sidebar">
    <button class="nav active" data-page="home">⌂ Home</button>
    <button class="nav" data-page="files">▤ Files</button>
    <button class="nav" data-page="notes">▧ Notes</button>
    <button class="nav" data-page="terminal">⌘ Terminal</button>
    <button class="nav" data-page="monitor">◉ Monitor</button>
    <button class="nav" data-page="diagnostics">⚙ Diagnostics</button>
    <button class="nav" data-page="settings">☷ Settings</button>
  </aside>

  <main id="main"></main>

</div>

<script>
"use strict";

/* =====================================
   CX WEB v0.6
   Persistent local workspace
===================================== */

const STORAGE_KEY = "cx";

let data = {};
let currentPage = "home";
let selectedFile = null;
let currentFolder = "/";
let saveTimer = null;

const main = document.getElementById("main");
const statusElement = document.getElementById("status");
const errorsElement = document.getElementById("errors");

function showError(error) {
  errorsElement.style.display = "block";
  errorsElement.textContent =
    "CX encountered an error:\n" +
    (error && error.message ? error.message : String(error));
}

window.addEventListener("error", function(event) {
  showError(event.error || event.message);
});

window.addEventListener("unhandledrejection", function(event) {
  showError(event.reason);
});

/* =====================================
   STORAGE
===================================== */

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);

  if (!raw) {
    data = {
      fs: {
        "/": {t:"d"}
      },
      notes: [],
      j: [],
      settings: {},
      set: {}
    };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return;
  }

  const parsed = JSON.parse(raw);

  if (!parsed || typeof parsed !== "object") {
    throw new Error("Stored workspace has an invalid format.");
  }

  data = parsed;

  if (!data.fs || typeof data.fs !== "object") {
    data.fs = {"/":{t:"d"}};
  }

  if (!data.fs["/"]) {
    data.fs["/"] = {t:"d"};
  }
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  statusElement.textContent = "Saved locally";
}

function getFiles() {
  return data.fs || {};
}

/* =====================================
   FILE CONTENT COMPATIBILITY
===================================== */

function readContent(entry) {
  if (!entry || typeof entry !== "object") {
    return "";
  }

  if (typeof entry.c === "string") {
    return entry.c;
  }

  if (typeof entry.content === "string") {
    return entry.content;
  }

  return "";
}

function writeContent(entry, value) {
  if (!entry || typeof entry !== "object") {
    return;
  }

  /*
    Preserve the original file format.
    Existing files using "c" remain "c".
    Files using "content" remain "content".
  */

  if (Object.prototype.hasOwnProperty.call(entry, "c")) {
    entry.c = value;
  } else if (
    Object.prototype.hasOwnProperty.call(entry, "content")
  ) {
    entry.content = value;
  } else {
    entry.c = value;
  }
}

function getParent(path) {
  if (path === "/") return null;

  const parts = path.split("/");
  parts.pop();

  return parts.join("/") || "/";
}

function getName(path) {
  return path.split("/").filter(Boolean).pop() || "/";
}

function getChildren(folder) {
  const files = getFiles();

  return Object.keys(files).filter(function(path) {
    if (path === "/") return false;

    return getParent(path) === folder;
  });
}

/* =====================================
   NAVIGATION
===================================== */

document.querySelectorAll(".nav").forEach(function(button) {
  button.addEventListener("click", function() {
    currentPage = button.dataset.page;

    document.querySelectorAll(".nav").forEach(function(item) {
      item.classList.remove("active");
    });

    button.classList.add("active");

    render();
  });
});

function navigate(page) {
  currentPage = page;

  document.querySelectorAll(".nav").forEach(function(button) {
    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  render();
}

/* =====================================
   HOME
===================================== */

function renderHome() {
  const files = getFiles();

  const fileCount = Object.keys(files).filter(function(path) {
    return path !== "/" && files[path].t !== "d";
  }).length;

  const folderCount = Object.keys(files).filter(function(path) {
    return path !== "/" && files[path].t === "d";
  }).length;

  const journalCount = Array.isArray(data.j) ? data.j.length : 0;

  main.innerHTML = `
    <h1>CX Workspace</h1>
    <p>A persistent computing workspace.</p>

    <div class="stat-grid">
      <div class="stat">
        <span class="muted">Files</span>
        <strong>${fileCount}</strong>
      </div>

      <div class="stat">
        <span class="muted">Folders</span>
        <strong>${folderCount}</strong>
      </div>

      <div class="stat">
        <span class="muted">Journal records</span>
        <strong>${journalCount}</strong>
      </div>
    </div>

    <div class="card">
      <h2>Workspace</h2>
      <p>Your files and settings are stored in this browser.</p>

      <div class="actions">
        <button class="primary" onclick="navigate('files')">
          Open Files
        </button>

        <button onclick="navigate('diagnostics')">
          Run Diagnostics
        </button>
      </div>
    </div>

    <div class="card">
      <h2>Current version</h2>
      <p>CX Web v0.6</p>
      <p class="muted">
        Local workspace mode. Remote execution and cross-device
        synchronization are not yet implemented.
      </p>
    </div>
  `;
}

/* =====================================
   FILES
===================================== */

function renderFiles() {
  const children = getChildren(currentFolder);

  let html = `
    <div class="row">
      <div>
        <h1>Files</h1>
        <p>Location: ${escapeHTML(currentFolder)}</p>
      </div>

      <div class="actions">
        <button onclick="createFile()">+ File</button>
        <button onclick="createFolder()">+ Folder</button>
      </div>
    </div>

    <div class="card">
  `;

  if (currentFolder !== "/") {
    html += `
      <div class="file-row" onclick="goParent()">
        <span class="file-icon">↩</span>
        <span class="file-name">.. Back</span>
      </div>
    `;
  }

  if (children.length === 0) {
    html += `<p>This folder is empty.</p>`;
  }

  children.forEach(function(path) {
    const entry = getFiles()[path];
    const isFolder = entry.t === "d";

    html += `
      <div class="file-row"
           onclick="openPath('${escapeJS(path)}')">

        <span class="file-icon">
          ${isFolder ? "📁" : "📄"}
        </span>

        <span class="file-name">
          ${escapeHTML(getName(path))}
        </span>

        <span class="muted">
          ${isFolder ? "Folder" : "File"}
        </span>
      </div>
    `;
  });

  html += `</div>`;

  if (selectedFile && getFiles()[selectedFile]) {
    const entry = getFiles()[selectedFile];
    const content = readContent(entry);

    html += `
      <div class="card">
        <div class="row">
          <div>
            <h2>${escapeHTML(getName(selectedFile))}</h2>
            <div class="muted">${escapeHTML(selectedFile)}</div>
          </div>

          <div class="actions">
            <button onclick="saveCurrentFile()" class="primary">
              Save
            </button>

            <button onclick="renameCurrentFile()">
              Rename
            </button>

            <button onclick="deleteCurrentFile()">
              Delete
            </button>
          </div>
        </div>

        <textarea id="editor" spellcheck="false"></textarea>

        <div id="editorStatus">
          Stored content length: ${content.length} characters
        </div>
      </div>
    `;
  }

  main.innerHTML = html;

  /*
    Set textarea content after rendering.
    This avoids HTML parsing problems with file text.
  */

  if (selectedFile && getFiles()[selectedFile]) {
    const editor = document.getElementById("editor");

    if (editor) {
      editor.value = readContent(getFiles()[selectedFile]);
    }
  }
}

function openPath(path) {
  const entry = getFiles()[path];

  if (!entry) {
    alert("This file or folder no longer exists.");
    return;
  }

  if (entry.t === "d") {
    currentFolder = path;
    selectedFile = null;
    renderFiles();
    return;
  }

  selectedFile = path;
  renderFiles();
}

function goParent() {
  currentFolder = getParent(currentFolder) || "/";
  selectedFile = null;
  renderFiles();
}

function saveCurrentFile() {
  if (!selectedFile) return;

  const entry = getFiles()[selectedFile];
  const editor = document.getElementById("editor");

  if (!entry || !editor) {
    alert("Unable to access the selected file.");
    return;
  }

  writeContent(entry, editor.value);

  try {
    persist();

    const message = document.getElementById("editorStatus");

    if (message) {
      message.textContent =
        "Saved successfully. " +
        editor.value.length +
        " characters.";
    }
  } catch (error) {
    showError(error);
  }
}

function createFile() {
  const name = prompt("Enter file name:");

  if (!name || !name.trim()) return;

  const path =
    currentFolder === "/"
      ? "/" + name
      : currentFolder + "/" + name;

  if (getFiles()[path]) {
    alert("A file or folder with that name already exists.");
    return;
  }

  data.fs[path] = {
    t:"f",
    c:""
  };

  persist();

  selectedFile = path;
  renderFiles();
}

function createFolder() {
  const name = prompt("Enter folder name:");

  if (!name || !name.trim()) return;

  const path =
    currentFolder === "/"
      ? "/" + name
      : currentFolder + "/" + name;

  if (getFiles()[path]) {
    alert("A file or folder with that name already exists.");
    return;
  }

  data.fs[path] = {t:"d"};

  persist();
  renderFiles();
}

function deleteCurrentFile() {
  if (!selectedFile) return;

  const confirmed = confirm(
    "Delete " + selectedFile + "?"
  );

  if (!confirmed) return;

  delete data.fs[selectedFile];

  selectedFile = null;

  persist();
  renderFiles();
}

function renameCurrentFile() {
  if (!selectedFile) return;

  const oldPath = selectedFile;
  const oldName = getName(oldPath);

  const newName = prompt("New file name:", oldName);

  if (!newName || !newName.trim()) return;

  const parent = getParent(oldPath);

  const newPath =
    parent === "/"
      ? "/" + newName
      : parent + "/" + newName;

  if (getFiles()[newPath]) {
    alert("That name already exists.");
    return;
  }

  data.fs[newPath] = data.fs[oldPath];

  delete data.fs[oldPath];

  selectedFile = newPath;

  persist();
  renderFiles();
}

/* =====================================
   NOTES
===================================== */

function renderNotes() {
  if (!Array.isArray(data.notes)) {
    data.notes = [];
  }

  let html = `
    <h1>Notes</h1>
    <p>Workspace notes.</p>

    <div class="card">
      <textarea id="newNote"
        placeholder="Write a note..."
        style="min-height:120px"></textarea>

      <br><br>

      <button class="primary" onclick="addNote()">
        Save Note
      </button>
    </div>
  `;

  data.notes.forEach(function(note, index) {
    const text =
      typeof note === "string"
        ? note
        : (note.text || "");

    html += `
      <div class="card">
        <p>${escapeHTML(text)}</p>
        <button onclick="deleteNote(${index})">
          Delete
        </button>
      </div>
    `;
  });

  main.innerHTML = html;
}

function addNote() {
  const input = document.getElementById("newNote");

  if (!input || !input.value.trim()) return;

  data.notes.push({
    text:input.value,
    createdAt:new Date().toISOString()
  });

  persist();
  renderNotes();
}

function deleteNote(index) {
  if (!confirm("Delete this note?")) return;

  data.notes.splice(index, 1);

  persist();
  renderNotes();
}

/* =====================================
   TERMINAL
===================================== */

function renderTerminal() {
  main.innerHTML = `
    <h1>Terminal</h1>
    <p>Local workspace command interface.</p>

    <div class="card">
      <div id="terminalOutput">
CX Web Terminal v0.6
Type help to see available commands.
      </div>

      <input id="terminalInput"
        placeholder="Enter command..."
        autocomplete="off">

      <br><br>

      <button class="primary" onclick="runCommand()">
        Run
      </button>
    </div>
  `;

  const input = document.getElementById("terminalInput");

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      runCommand();
    }
  });
}

function terminalPrint(text) {
  const output = document.getElementById("terminalOutput");

  output.textContent += "\n" + text;
  output.scrollTop = output.scrollHeight;
}

function runCommand() {
  const input = document.getElementById("terminalInput");

  if (!input) return;

  const command = input.value.trim();
  input.value = "";

  if (!command) return;

  terminalPrint("> " + command);

  const parts = command.split(" ");
  const action = parts[0].toLowerCase();

  if (action === "help") {
    terminalPrint(
      "Available commands:\n" +
      "help - show commands\n" +
      "ls - list files\n" +
      "pwd - show current location\n" +
      "clear - clear terminal\n" +
      "version - show CX version\n" +
      "files - count workspace files\n" +
      "journal - count journal entries"
    );
  }

  else if (action === "ls") {
    terminalPrint(getChildren(currentFolder).join("\n") || "Empty");
  }

  else if (action === "pwd") {
    terminalPrint(currentFolder);
  }

  else if (action === "clear") {
    document.getElementById("terminalOutput").textContent = "";
  }

  else if (action === "version") {
    terminalPrint("CX Web v0.6");
  }

  else if (action === "files") {
    const count = Object.keys(getFiles()).filter(function(path) {
      return path !== "/" && getFiles()[path].t !== "d";
    }).length;

    terminalPrint("Files: " + count);
  }

  else if (action === "journal") {
    terminalPrint(
      "Journal records: " +
      (Array.isArray(data.j) ? data.j.length : 0)
    );
  }

  else {
    terminalPrint("Unknown command. Type help.");
  }
}

/* =====================================
   MONITOR
===================================== */

function renderMonitor() {
  const files = Object.keys(getFiles()).filter(function(path) {
    return path !== "/" && getFiles()[path].t !== "d";
  });

  let totalCharacters = 0;

  files.forEach(function(path) {
    totalCharacters += readContent(getFiles()[path]).length;
  });

  const storageSize =
    new Blob([localStorage.getItem(STORAGE_KEY) || ""]).size;

  main.innerHTML = `
    <h1>Monitor</h1>
    <p>Local workspace information.</p>

    <div class="stat-grid">
      <div class="stat">
        <span class="muted">Files</span>
        <strong>${files.length}</strong>
      </div>

      <div class="stat">
        <span class="muted">Characters</span>
        <strong>${totalCharacters}</strong>
      </div>

      <div class="stat">
        <span class="muted">Journal entries</span>
        <strong>${Array.isArray(data.j) ? data.j.length : 0}</strong>
      </div>

      <div class="stat">
        <span class="muted">Storage size</span>
        <strong>${formatBytes(storageSize)}</strong>
      </div>
    </div>

    <div class="card">
      <h2>Runtime</h2>
      <p>Browser: ${escapeHTML(navigator.userAgent)}</p>
      <p>Storage: localStorage</p>
      <p>Execution: local browser</p>
      <p>Network compute: not connected</p>
    </div>
  `;
}

/* =====================================
   DIAGNOSTICS
===================================== */

function renderDiagnostics() {
  const files = getFiles();

  let rows = "";

  Object.keys(files).forEach(function(path) {
    const entry = files[path];

    if (entry.t === "d") return;

    const content = readContent(entry);

    rows += `
      <div class="card">
        <strong>${escapeHTML(path)}</strong>

        <p>
          Type: ${escapeHTML(entry.t || "unknown")}<br>
          Content length: ${content.length}<br>
          Content field:
          ${
            Object.prototype.hasOwnProperty.call(entry, "c")
              ? "c"
              : Object.prototype.hasOwnProperty.call(entry, "content")
                ? "content"
                : "not found"
          }
        </p>

        <pre style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(content)}</pre>

        <button onclick="openPath('${escapeJS(path)}')">
          Open File
        </button>
      </div>
    `;
  });

  const raw = localStorage.getItem(STORAGE_KEY) || "";

  main.innerHTML = `
    <h1>Diagnostics</h1>
    <p>Inspecting the actual stored workspace data.</p>

    <div class="card">
      <h2>Storage status</h2>
      <p>Storage key: ${STORAGE_KEY}</p>
      <p>Stored characters: ${raw.length}</p>
      <p>Filesystem entries: ${Object.keys(files).length}</p>
      <p>Journal records: ${
        Array.isArray(data.j) ? data.j.length : "Invalid"
      }</p>
      <p>Legacy settings object: ${
        data.set ? "Present" : "Missing"
      }</p>
      <p>Current settings object: ${
        data.settings ? "Present" : "Missing"
      }</p>
    </div>

    <h2>File inspection</h2>
    ${rows || "<p>No files found.</p>"}

    <div class="card">
      <h2>Workspace export</h2>
      <button class="primary" onclick="exportWorkspace()">
        Export workspace JSON
      </button>
    </div>
  `;
}

/* =====================================
   SETTINGS
===================================== */

function renderSettings() {
  const settings = data.settings || {};

  main.innerHTML = `
    <h1>Settings</h1>
    <p>Workspace preferences.</p>

    <div class="card">
      <h2>Appearance</h2>

      <label class="muted">Theme</label>

      <select id="themeSelect"
        style="width:100%;padding:12px;background:var(--bg);
        color:var(--text);border:1px solid var(--line);
        border-radius:8px;margin-top:8px">

        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="auto">Auto</option>
      </select>

      <br><br>

      <button class="primary" onclick="saveSettings()">
        Save Settings
      </button>
    </div>

    <div class="card">
      <h2>Workspace data</h2>

      <button onclick="exportWorkspace()">
        Export Workspace
      </button>

      <br><br>

      <input type="file" id="importFile" accept=".json,application/json">

      <br><br>

      <button onclick="importWorkspace()">
        Import Workspace
      </button>
    </div>
  `;

  document.getElementById("themeSelect").value =
    settings.theme || "dark";
}

function saveSettings() {
  const theme = document.getElementById("themeSelect").value;

  if (!data.settings || typeof data.settings !== "object") {
    data.settings = {};
  }

  data.settings.theme = theme;

  /*
    Do not delete or replace legacy "set" settings.
  */

  persist();

  alert("Settings saved.");
}

/* =====================================
   EXPORT / IMPORT
===================================== */

function exportWorkspace() {
  const json = JSON.stringify(data, null, 2);

  const blob = new Blob([json], {
    type:"application/json"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "cx-workspace-backup.json";
  link.click();

  URL.revokeObjectURL(url);
}

function importWorkspace() {
  const input = document.getElementById("importFile");

  if (!input || !input.files || !input.files[0]) {
    alert("Select a JSON backup first.");
    return;
  }

  if (!confirm(
    "Importing replaces the current workspace. Continue?"
  )) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function() {
    try {
      const imported = JSON.parse(reader.result);

      if (!imported || typeof imported !== "object" ||
          !imported.fs) {
        throw new Error("Invalid CX workspace backup.");
      }

      data = imported;

      persist();

      selectedFile = null;
      currentFolder = "/";

      alert("Workspace imported.");
      render();

    } catch (error) {
      alert("Import failed: " + error.message);
    }
  };

  reader.readAsText(input.files[0]);
}

/* =====================================
   HELPERS
===================================== */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char];
  });
}

function escapeJS(value) {
  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n");
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";

  if (bytes < 1024 * 1024) {
    return (bytes / 1024).toFixed(2) + " KB";
  }

  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

/* =====================================
   PAGE RENDERER
===================================== */

function render() {
  try {
    if (currentPage === "home") renderHome();
    else if (currentPage === "files") renderFiles();
    else if (currentPage === "notes") renderNotes();
    else if (currentPage === "terminal") renderTerminal();
    else if (currentPage === "monitor") renderMonitor();
    else if (currentPage === "diagnostics") renderDiagnostics();
    else if (currentPage === "settings") renderSettings();
    else renderHome();

  } catch (error) {
    showError(error);
  }
}

/* =====================================
   START
===================================== */

try {
  loadData();
  render();

  statusElement.textContent = "Workspace ready";

} catch (error) {
  showError(error);
  main.innerHTML = `
    <h1>CX Workspace Error</h1>
    <p>The workspace could not be loaded.</p>
    <p>Do not clear browser storage.</p>
  `;
}
</script>
